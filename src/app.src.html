<title>Mr Chait's Classroom</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Nunito:wght@700;800;900&display=swap">
<style>
/* Layout: one-screen game. Home picks a deck; the game screen is one card (timer ring in the header, score strip, one word at a time, GOT IT / SKIP), then a Mr Chait result panel when time is up. */
:root{
  --night:#241A4D; --night-2:#2E2266; --night-3:#3A2D7A;
  --sun:#FFD23F; --pop:#FF4F9A; --paper:#FFFFFF; --ink:#1B1438; --ink-soft:#5B5480;
  --good:#1FA463; --good-t:#E3F6EC; --bad:#E0303F; --hint:#FFF5CC; --hint-line:#F0B400;
  --disabled:#B9B3D6;
  --display:'Luckiest Guy', 'Arial Black', Impact, sans-serif;
  --body:'Nunito', 'Trebuchet MS', 'Segoe UI', sans-serif;
  color-scheme: dark;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--paper);font-family:var(--body);overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:repeating-conic-gradient(from 0deg at 50% 40%,var(--night-2) 0deg 9deg,var(--night) 9deg 18deg);opacity:.9}
.app{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column;align-items:center;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:14px 20px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:4px solid var(--sun);outline-offset:3px}

/* ---------- logo */
.logo{font-family:var(--display);line-height:.86;display:inline-flex;flex-direction:column;align-items:flex-start}
.logo .mr{background:var(--pop);color:var(--paper);font-size:.42em;letter-spacing:.06em;padding:.3em .55em .14em;border-radius:.5em;
  transform:rotate(-4deg);margin-bottom:.3em;box-shadow:.1em .1em 0 var(--sun)}
.logo .one{color:var(--sun);font-size:.52em;letter-spacing:.06em}
.logo .mad{color:var(--paper)}
.logo .mad.cls{font-size:.86em;letter-spacing:.01em;margin-top:.04em}
.logo .mad b{font-weight:400;color:var(--pop);font-size:1.2em;-webkit-text-stroke:.03em var(--paper);paint-order:stroke fill;text-shadow:.05em .05em 0 var(--sun)}

/* ---------- top bar */
.bar{width:100%;max-width:640px;display:flex;align-items:center;gap:10px;min-height:48px}
.bar .grow{flex:1}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--night-3);border:2px solid rgba(255,255,255,.18);
  border-radius:999px;padding:8px 14px;font-weight:900;font-size:15px;letter-spacing:.02em;white-space:nowrap}
.chip svg{flex:none}
.round-label{font-family:var(--display);font-size:20px;letter-spacing:.04em;color:var(--sun);white-space:nowrap}
@media (max-width:400px){.bar .chip span{display:none}.bar .chip{padding:9px 12px}}

/* ---------- home */
.home{width:100%;max-width:640px;display:flex;flex-direction:column;align-items:center;gap:22px;padding-top:8px}
.hero{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.hero .logo{font-size:clamp(46px, 13vw, 84px);align-items:center}
.hero .logo .mr{align-self:center}
.tagline{font-weight:800;font-size:17px;color:var(--sun);max-width:34ch}
.section-title{align-self:flex-start;font-family:var(--display);font-size:22px;letter-spacing:.04em;color:var(--paper)}
.decks{width:100%;display:grid;grid-template-columns:1fr;gap:12px}
.deck{display:flex;align-items:center;gap:16px;text-align:left;width:100%;background:var(--paper);color:var(--ink);
  border-radius:20px;padding:16px 18px;border:4px solid var(--sun);box-shadow:0 6px 0 var(--pop);transition:transform .12s}
.deck:active{transform:translateY(3px);box-shadow:0 3px 0 var(--pop)}
.deck .stack{flex:none;width:58px;height:72px;border-radius:10px;background:var(--night);display:flex;align-items:center;justify-content:center;
  box-shadow:5px 5px 0 var(--night-3), 9px 9px 0 var(--sun)}
.deck .info{flex:1;min-width:0}
.deck h3{margin:0;font-family:var(--display);font-weight:400;font-size:24px;letter-spacing:.03em;color:var(--night)}
.deck p{margin:2px 0 8px;font-weight:800;font-size:14px;color:var(--ink-soft)}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots span{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;
  color:var(--paper);background:var(--c);border-radius:999px;padding:3px 8px}
.deck .go{flex:none;width:52px;height:52px;border-radius:50%;background:var(--sun);display:flex;align-items:center;justify-content:center;color:var(--night)}
.deck.soon{background:transparent;border:3px dashed rgba(255,255,255,.3);box-shadow:none;color:var(--paper);cursor:default}
.deck.soon h3{color:var(--paper);opacity:.75}
.deck.soon p{color:var(--disabled)}
.deck.soon .stack{background:transparent;border:3px dashed rgba(255,255,255,.3);box-shadow:none}
.how{width:100%;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.14);border-radius:20px;padding:16px 18px}
.how ol{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.how li{display:flex;gap:12px;align-items:flex-start;font-weight:800;font-size:15.5px;line-height:1.35;color:#E9E5FF}
.how li b{color:var(--sun)}
.how .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--pop);color:var(--paper);font-family:var(--display);
  font-size:16px;display:flex;align-items:center;justify-content:center;padding-top:2px}

/* ---------- game */
.game{width:100%;max-width:640px;flex:1;display:flex;flex-direction:column;align-items:center;gap:16px}
.stage{width:100%;perspective:1400px}
.card{position:relative;width:100%;border-radius:26px;background:var(--paper);color:var(--ink);overflow:hidden;
  border:6px solid var(--night);box-shadow:0 0 0 4px var(--sun), 0 14px 0 4px var(--pop);
  transform-style:preserve-3d}
.card.flip{animation:flip .55s cubic-bezier(.2,.8,.3,1.2)}
@keyframes flip{0%{transform:rotateY(90deg) scale(.95)}100%{transform:rotateY(0) scale(1)}}
.card.shake{animation:shake .5s}
@keyframes shake{20%,60%{transform:translateX(-10px) rotate(-1deg)}40%,80%{transform:translateX(10px) rotate(1deg)}}
.head{background:var(--night);color:var(--paper);display:flex;align-items:center;gap:12px;padding:14px 16px 14px 18px;
  background-image:radial-gradient(rgba(255,255,255,.10) 1.2px,transparent 1.6px);background-size:12px 12px}
.head .logo{font-size:clamp(26px, 6.4vw, 36px)}
.head .grow{flex:1}

/* timer ring */
.timer{position:relative;flex:none;width:clamp(78px, 21vw, 104px);aspect-ratio:1;max-width:100%}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer .track{fill:var(--night-3);stroke:rgba(255,255,255,.18);stroke-width:9}
.timer .fill{fill:none;stroke:var(--sun);stroke-width:9;stroke-linecap:round;transition:stroke .3s}
.timer .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:var(--display);color:var(--paper);font-size:clamp(28px, 8vw, 40px);line-height:.9;padding-top:4px;font-variant-numeric:tabular-nums}
.timer .num small{font-family:var(--body);font-weight:900;font-size:11px;letter-spacing:.12em;color:var(--sun)}
.timer.hurry .fill{stroke:var(--pop)}
.timer.hurry .num{animation:pulse 1s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}

/* score strip under the card head */
.scorebar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 18px;background:var(--sun);color:var(--night)}
.scorebar .lbl{font-family:var(--display);font-size:clamp(17px, 4.4vw, 22px);letter-spacing:.05em;padding-top:3px}
.scorebar .n{display:inline-flex;align-items:center;gap:6px;font-family:var(--display);font-size:clamp(32px, 8.5vw, 44px);line-height:1;padding-top:4px}
.scorebar .n svg{width:.75em;height:.75em;color:var(--good);margin-top:-6px}
.scorebar .n.bump{animation:pop .35s}

/* the one word on screen */
.play{padding:18px;display:flex;flex-direction:column;gap:16px}
.now{--c:#888;--t:#eee;border-radius:22px;background:var(--t);border:4px solid var(--c);overflow:hidden;transition:background .25s,border-color .25s}
.now .in{min-height:clamp(150px, 24vh, 230px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:18px 16px;text-align:center}
.now .in.slide{animation:slidein .32s cubic-bezier(.2,.8,.3,1.15)}
.now .in.back{animation:slideback .32s cubic-bezier(.2,.8,.3,1.15)}
@keyframes slidein{from{opacity:0;transform:translateX(60px) scale(.92)}to{opacity:1;transform:none}}
@keyframes slideback{from{opacity:0;transform:translateX(-60px) scale(.92)}to{opacity:1;transform:none}}
.word{font-weight:900;font-size:clamp(34px, 9vw, 54px);line-height:1.05;color:var(--ink);overflow-wrap:break-word;hyphens:manual;max-width:100%}
.word.long{font-size:clamp(27px, 7vw, 50px)}
.tag{display:flex;align-items:center;gap:6px;font-weight:900;font-size:13.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--c)}
.now .lock{display:none;width:40px;height:40px;color:var(--disabled)}
.now .lock svg{width:100%;height:100%}
.now.missed .lock{display:block}
.hintbox{display:none;margin:0 14px 14px;background:var(--hint);border:3px dashed var(--hint-line);border-radius:14px;padding:10px 14px;text-align:left}
.now.missed .hintbox,.now.hinted .hintbox{display:block;animation:drop .35s ease-out}
.hint-btn{display:inline-flex;align-items:center;gap:6px;margin-top:2px;background:var(--hint);color:var(--ink);border:3px solid var(--hint-line);
  border-radius:999px;padding:7px 16px 6px;font-weight:900;font-size:16px;letter-spacing:.05em;transition:transform .1s}
.hint-btn:active{transform:scale(.94)}
.hint-btn svg{width:18px;height:18px;color:var(--hint-line);margin-top:-2px}
.hint-btn small{font-size:13px;font-weight:900;color:var(--bad);letter-spacing:.02em}
.hint-btn[disabled]{opacity:.45;cursor:default}
.now.hinted .hint-btn,.now.missed .hint-btn{display:none}
.timer .minus{position:absolute;left:50%;top:50%;z-index:2;font-family:var(--display);font-size:clamp(26px, 7vw, 36px);color:var(--paper);
  background:var(--bad);border:3px solid var(--paper);border-radius:12px;padding:4px 8px 0;white-space:nowrap;pointer-events:none;
  animation:minus 1.1s ease-out forwards}
@keyframes minus{0%{transform:translate(-50%,-50%) scale(.4);opacity:0}20%{transform:translate(-50%,-50%) scale(1.15);opacity:1}
  70%{transform:translate(-50%,-60%) scale(1);opacity:1}100%{transform:translate(-50%,-110%) scale(.9);opacity:0}}
.timer.drain .fill{animation:drainflash .6s}
@keyframes drainflash{0%,100%{stroke:var(--sun)}50%{stroke:var(--bad)}}
.chips span.h svg.b{color:var(--hint-line)}
@keyframes drop{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.hintbox .lbl{font-family:var(--display);font-size:16px;letter-spacing:.05em;color:var(--bad)}
.hintbox p{margin:2px 0 0;font-weight:800;font-size:clamp(17px, 4vw, 21px);line-height:1.35;color:var(--ink)}
.hintbox .nt{margin-top:6px;font-size:13px;font-weight:900;color:var(--ink-soft);letter-spacing:.02em}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.15)}100%{transform:scale(1)}}

/* GOT IT / SKIP */
.btns{display:flex;gap:12px}
.got-btn,.skip-btn{display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--display);letter-spacing:.05em;border-radius:20px;
  padding:16px 14px 10px;transition:transform .1s, box-shadow .1s}
.got-btn{flex:2.2;background:var(--good);color:var(--paper);font-size:clamp(28px, 7.4vw, 38px);box-shadow:0 7px 0 #137A48}
.got-btn svg{width:1em;height:1em;margin-top:-6px}
.got-btn:active{transform:translateY(5px);box-shadow:0 2px 0 #137A48}
.skip-btn{flex:1;background:var(--paper);color:var(--ink-soft);border:3px solid var(--disabled);font-size:clamp(20px, 5vw, 26px);box-shadow:0 6px 0 var(--disabled)}
.skip-btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--disabled)}

/* words so far this round */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips:empty{display:none}
.chips span{display:inline-flex;align-items:center;gap:4px;font-weight:900;font-size:13px;padding:4px 10px;border-radius:999px;background:var(--good-t);color:#137A48;border:2px solid var(--good)}
.chips span svg{width:12px;height:12px}
.chips span.sk{background:#F1EFF8;color:var(--ink-soft);border-color:var(--disabled);text-decoration:line-through}
.chips span.new{animation:pop .3s}
.undo{display:inline-flex;align-items:center;gap:6px;font-weight:900;font-size:15px;color:var(--paper);background:var(--night-3);
  border:2px solid rgba(255,255,255,.22);border-radius:999px;padding:8px 16px}
.undo[disabled]{visibility:hidden}

/* end-of-round result with Mr Chait */
.result{width:100%;display:flex;align-items:flex-end;gap:6px;animation:rise .5s .35s cubic-bezier(.2,.8,.3,1.2) both}
@keyframes rise{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
.result .me{flex:none;height:clamp(150px, 34vw, 210px);width:auto;max-width:none;filter:drop-shadow(0 4px 0 rgba(0,0,0,.2));margin-bottom:-6px}
.bubble{position:relative;flex:1;min-width:0;background:var(--paper);color:var(--night);border:5px solid var(--night);border-radius:22px;
  box-shadow:6px 6px 0 var(--pop);padding:14px 16px 12px;margin-bottom:22px;text-align:center}
.bubble::before{content:"";position:absolute;left:-19px;bottom:22px;border:11px solid transparent;border-right:15px solid var(--night)}
.bubble .ribbon{display:inline-block;background:var(--pop);color:var(--paper);font-family:var(--display);font-size:16px;letter-spacing:.06em;
  padding:5px 12px 2px;border-radius:10px;transform:rotate(-4deg);margin-bottom:6px}
.bubble .big{font-family:var(--display);font-size:clamp(28px, 7.4vw, 40px);line-height:1;letter-spacing:.03em;padding-top:4px}
.bubble .big b{font-weight:400;color:var(--pop);font-size:1.5em;-webkit-text-stroke:.03em var(--night);paint-order:stroke fill}
.bubble .line{margin-top:6px;font-weight:900;font-size:clamp(16px, 4vw, 19px);line-height:1.3}
.bubble .best{margin-top:6px;font-weight:900;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}

/* card back (ready screen) */
.back{background:var(--night);border-color:var(--night);min-height:clamp(380px, 62vh, 470px);display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:18px;padding:26px 20px;text-align:center;
  background-image:repeating-conic-gradient(from 0deg at 50% 42%,var(--night-2) 0deg 10deg,var(--night) 10deg 20deg)}
.badge{width:min(250px, 64vw);aspect-ratio:1;max-width:100%;border-radius:50%;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  border:7px solid var(--sun);box-shadow:0 0 0 7px var(--pop);transform:rotate(-6deg)}
.badge .logo{font-size:clamp(30px, 8vw, 40px);align-items:center}
.badge .logo .mr{align-self:center}
.badge .logo .one,.badge .logo .mad{color:var(--night)}
.badge .logo .mad b{-webkit-text-stroke:.03em var(--night)}
.back .msg{max-width:30ch;font-weight:900;font-size:17px;line-height:1.35;color:var(--paper)}
.back .msg b{color:var(--sun)}

/* banner over the card */
.banner{position:absolute;left:50%;top:92px;transform:translateX(-50%) rotate(-5deg);z-index:3;white-space:nowrap;
  font-family:var(--display);font-size:clamp(30px, 8vw, 44px);letter-spacing:.04em;padding:10px 22px 4px;border-radius:14px;
  border:5px solid var(--paper);box-shadow:0 6px 0 rgba(0,0,0,.25);animation:stamp .45s cubic-bezier(.2,.8,.3,1.4) both;pointer-events:none}
.banner.up{background:var(--bad);color:var(--paper)}
.banner.win{background:var(--sun);color:var(--night)}
.banner.win b{font-weight:400;color:var(--pop)}
@keyframes stamp{from{transform:translateX(-50%) rotate(-5deg) scale(2.2);opacity:0}to{transform:translateX(-50%) rotate(-5deg) scale(1);opacity:1}}
.banner.fade{animation:fadeout .5s 1.6s forwards}
@keyframes fadeout{to{opacity:0;transform:translateX(-50%) rotate(-5deg) translateY(-20px)}}

/* big action button */
.action{width:min(420px, 100%);font-family:var(--display);font-size:clamp(28px, 7vw, 36px);letter-spacing:.06em;
  padding:16px 20px 10px;border-radius:20px;background:var(--sun);color:var(--night);
  box-shadow:0 8px 0 var(--pop);transition:transform .1s, box-shadow .1s;display:flex;align-items:center;justify-content:center;gap:12px}
.action:active{transform:translateY(5px);box-shadow:0 3px 0 var(--pop)}
.action.next{background:var(--pop);color:var(--paper);box-shadow:0 8px 0 var(--sun)}
.action.next:active{box-shadow:0 3px 0 var(--sun)}
.status{min-height:22px;font-weight:900;font-size:16px;color:var(--sun);text-align:center}

/* Mr Chait */
.lockup{display:inline-flex;align-items:center;gap:6px}
.lockup .me{flex:none;height:var(--me,120px);width:auto;max-width:none;filter:drop-shadow(0 4px 0 rgba(0,0,0,.18))}
.hero .lockup{--me:clamp(150px, 34vw, 230px);gap:clamp(4px, 2vw, 14px)}
.hero .lockup .logo{align-items:flex-start;font-size:clamp(40px, 10.5vw, 74px)}
.hero .lockup .logo .mr{align-self:flex-start}
.head .lockup{--me:clamp(70px, 17vw, 92px);margin:-6px 0 -10px -6px}
.backart{position:relative;display:flex;align-items:flex-end;justify-content:center;padding-left:clamp(70px, 20vw, 110px)}
.backart .me{position:absolute;left:0;bottom:-10px;height:clamp(150px, 40vw, 210px);width:auto;max-width:none;z-index:2;transform:rotate(-4deg)}
canvas#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:20}
/* ---------- teams */
:root{--blue:#1E63E0;--blue-d:#0F3C99;--blue-t:#E3ECFD;--red:#E6262E;--red-d:#9A1117;--red-t:#FDE4E5}
.team-blue{--tc:var(--blue);--td:var(--blue-d);--tt:var(--blue-t)}
.team-red{--tc:var(--red);--td:var(--red-d);--tt:var(--red-t)}
.action.team-blue,.action.team-red{background:var(--tc);color:var(--paper);box-shadow:0 8px 0 var(--td)}
.action.team-blue:active,.action.team-red:active{box-shadow:0 3px 0 var(--td)}
.chip.armed{background:var(--bad);border-color:var(--paper)}
.bar .chip.armed span{display:inline !important}

/* setup */
.setup{width:100%;max-width:640px;display:flex;flex-direction:column;align-items:center;gap:18px;padding-top:4px}
.deckname{font-family:var(--display);font-size:22px;letter-spacing:.04em;color:var(--sun);text-align:center}
.faceoff{width:100%;display:flex;align-items:flex-end;justify-content:center}
.side{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:10px}
.side img{height:clamp(170px, 40vw, 250px);width:auto;max-width:100%;filter:drop-shadow(0 5px 0 rgba(0,0,0,.25))}
.side.team-red img{transform:scaleX(-1)}
.side span{font-family:var(--display);font-size:clamp(20px, 5.6vw, 30px);letter-spacing:.04em;color:var(--paper);background:var(--tc);
  padding:8px 14px 2px;border-radius:12px;border:4px solid var(--paper);box-shadow:0 5px 0 var(--td);white-space:nowrap}
.vs{flex:none;align-self:center;margin:0 -8px 40px;font-family:var(--display);font-size:clamp(48px, 13vw, 76px);color:var(--sun);
  -webkit-text-stroke:3px var(--night);paint-order:stroke fill;text-shadow:5px 5px 0 var(--pop);transform:rotate(-8deg);z-index:1}
.panel{width:100%;background:var(--paper);color:var(--ink);border-radius:22px;border:5px solid var(--sun);box-shadow:0 7px 0 var(--pop);padding:16px 18px;text-align:center}
.panel .q{font-family:var(--display);font-size:clamp(21px, 5.6vw, 26px);letter-spacing:.03em;color:var(--night)}
.targets{display:flex;gap:clamp(6px, 2vw, 10px);justify-content:center;margin:12px 0}
.tgt{width:clamp(48px, 13vw, 62px);height:clamp(48px, 13vw, 62px);flex:none;border-radius:50%;font-family:var(--display);font-size:clamp(22px, 6vw, 28px);padding-top:5px;background:#F1EFF8;color:var(--night);
  border:4px solid var(--disabled);transition:transform .12s}
.tgt.on{background:var(--sun);border-color:var(--night);box-shadow:0 4px 0 var(--pop);transform:scale(1.1)}
.panel .note{font-weight:800;font-size:15px;line-height:1.35;color:var(--ink-soft)}
.panel .note b{color:var(--night)}
.practice{font-weight:900;font-size:15px;color:#C9C2F0;text-decoration:underline;padding:6px}

/* mini score in the top bar */
.mini{display:flex;align-items:center;gap:8px}

/* ------------------------------------------------------------ sound (Web Audio, no files) */
const Sound = (() => {
  let ctx = null, on = true;
  try { on = localStorage.getItem('omm-sound') !== 'off'; } catch (e) {}
  const ac = () => { if (!ctx) { const A = window.AudioContext || window.webkitAudioContext; if (A) ctx = new A(); } if (ctx && ctx.state === 'suspended') ctx.resume(); return ctx; };
  const tone = (f, t0, dur, type = 'sine', vol = .25, f2) => {
    const c = ac(); if (!c || !on) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, c.currentTime + t0);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, c.currentTime + t0 + dur);
    g.gain.setValueAtTime(0.0001, c.currentTime + t0);
    g.gain.exponentialRampToValueAtTime(vol, c.currentTime + t0 + .015);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + t0 + dur);
    o.connect(g).connect(c.destination); o.start(c.currentTime + t0); o.stop(c.currentTime + t0 + dur + .05);
  };
  return {
    unlock: ac,
    get on() { return on; },
    toggle() { on = !on; try { localStorage.setItem('omm-sound', on ? 'on' : 'off'); } catch (e) {} if (on) this.ding(); return on; },
    start() { [523, 659, 784, 1047].forEach((f, i) => tone(f, i * .08, .18, 'triangle', .22)); },
    ding() { tone(988, 0, .14, 'sine', .3); tone(1319, .09, .3, 'sine', .3); },
    undo() { tone(330, 0, .14, 'triangle', .2, 220); },
    skip() { tone(560, 0, .12, 'triangle', .16, 380); },
    hint() { tone(700, 0, .18, 'triangle', .2, 500); tone(480, .16, .3, 'triangle', .2, 300); },
    tick(hi) { tone(hi ? 1500 : 1150, 0, .05, 'square', .07); },
    buzz() { tone(150, 0, .75, 'sawtooth', .22, 110); tone(156, 0, .75, 'square', .12, 115); },
    win() { [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tone(f, i * .09, .22, 'triangle', .22)); },
  };
})();

/* ------------------------------------------------------------ rolling dealer: one word at a time */
// The whole deck is shuffled, then spread so the same topic never comes up twice in a row.
// No repeats until the deck runs out. A skipped word goes to the back of the pile to come round again.
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function Dealer(deck) {
  let q = [];
  const fill = () => {
    const pool = shuffle(deck.words.map(([t, w, h]) => ({ t, w, h })));
    let last = q.length ? q[q.length - 1].t : null;
    while (pool.length) { let i = pool.findIndex(x => x.t !== last); if (i < 0) i = 0; const x = pool.splice(i, 1)[0]; q.push(x); last = x.t; }
  };
  return {
    next() { if (!q.length) fill(); return q.shift(); },
    back(x) { q.unshift(x); },
    later(x) { q.push(x); },
  };
}

// The hint (the meaning) shows; the learner taps the right word out of four from the same topic.
// Wrong answers show the right one, come back a few questions later, and go on the words-to-study list.
// Personal best is kept on this device only (a number per deck + topic choice, no names).
let Q = null;
const QUIZ_TOPICS = {}; // remembered topic choice per deck, for this visit
const bestKey = (deck, topics) => `omm-best-${deck.id}-${[...topics].sort().join('')}`;
const getBest = k => { try { return +localStorage.getItem(k) || 0; } catch (e) { return 0; } };
const setBest = (k, v) => { try { localStorage.setItem(k, String(v)); } catch (e) {} };

function renderQuizSetup() {

  const all = sel.size === keys.length;

function beginRound() {

  paintWord();

  const frac = Math.max(0, S.left) / ROUND_SECONDS;
  document.getElementById('ringfill').setAttribute('stroke-dashoffset', (C * (1 - frac)).toFixed(1));
  document.getElementById('secs').textContent = Math.ceil(Math.max(0, S.left));
  el.classList.toggle('hurry', S.phase === 'playing' && S.left <= 10);
  const hb = document.getElementById('hintbtn');

}

}
function stopTimer() { cancelAnimationFrame(S.raf); }

// words a team should go and study: skipped, ran out of time on, or needed a hint
const WHY = { sk: 'Skipped', tm: 'Out of time', hn: 'Needed a hint' };
function noteStudy(includeCurrent) {
  const st = M.stats[M.turn];
  const add = (x, why) => { const e = st.study.get(x.w) || { x, why: new Set() }; e.why.add(why); st.study.set(x.w, e); };
  S.skipped.forEach(x => add(x, 'sk'));
  S.hinted.forEach(x => add(x, 'hn'));
  if (includeCurrent && S.cur) add(S.cur, 'tm');
  st.turns++; st.skips += S.skipped.length; st.hints += S.hinted.size;
  M.before = { ...M.score }; M.added = S.got.length; M.score[M.turn] += S.got.length;
}
function endRound() {
  stopTimer(); holdWake(false);
  const n = S.got.length;
  if (S.mode === 'match') { noteStudy(true); S.newBest = false; }
  else { S.newBest = S.round > 1 && n > S.best; if (n > S.best) S.best = n; }
  S.phase = 'done'; S.dir = '';
  renderGame(false);
  const card = document.getElementById('card');
  const banner = document.createElement('div');
  banner.className = 'banner up fade'; banner.textContent = 'TIME’S UP!';
  card.appendChild(banner); card.classList.add('shake');
  Sound.buzz();
  if (S.mode === 'match') setTimeout(() => {
    document.querySelectorAll('.track2 i').forEach(i => i.style.width = i.dataset.to + '%');
    if (M.added) Sound.ding();
  }, 1300);
  setTimeout(() => { if (S.phase !== 'done') return; if (n >= 5 || S.newBest) { Sound.win(); confetti(); } }, 700);
}

/* ------------------------------------------------------------ we have a winner + the final score sheet */
function winMatch() {
  stopTimer(); holdWake(false);
  noteStudy(false);
  M.winner = M.turn; S.phase = 'won'; S.screen = 'final';
  renderFinal();
  Sound.win(); setTimeout(() => Sound.win(), 1000); setTimeout(() => Sound.win(), 2000);
  confetti(); setTimeout(confetti, 2700);
}
function studyHTML(t) {
  const items = [...M.stats[t].study.values()]
    .sort((a, b) => (b.why.has('sk') - a.why.has('sk')) || (b.why.has('tm') - a.why.has('tm')) || a.x.w.localeCompare(b.x.w));
  const list = items.length ? `<ul>${items.map(e => `<li><b>${esc(e.x.w)}</b>${[...e.why].map(k => `<em class="why ${k}">${WHY[k]}</em>`).join('')}<p>${esc(e.x.h)}</p></li>`).join('')}</ul>`
    : '<p class="none">Nothing to study. Flawless! 🏆</p>';
  return `<div class="slist team-${t}"><h4>TEAM ${TEAMS[t].name}: WORDS TO STUDY</h4>${list}</div>`;
}
function renderFinal() {
  const w = M.winner, l = other(w), s = M.stats;
  const cell = (t, k) => `<td>${k === 'score' ? M.score[t] : s[t][k]}</td>`;
  app.innerHTML = `${topBar()}<div class="final">
    <div class="winhero team-${w}">
      <div class="winstamp">${TEAMS[w].name} WINS!</div>
      <img src="${TEAMS[w].img}" alt="${TEAMS[w].name} Mr Chait celebrating">
      <div class="whoo">WHOOOHOOO! MADNE<b>SS</b>!</div>
      <div class="finalscore"><span class="pill team-blue">BLUE ${M.score.blue}</span><span class="dash">–</span><span class="pill team-red">${M.score.red} RED</span></div>
    </div>
    <div class="sheet">
      <h3>SCORE SHEET</h3>
      <div class="meta">${esc(S.deck.title)} · first to ${M.target}</div>
      <table class="stats"><thead><tr><th></th><th class="team-blue">BLUE</th><th class="team-red">RED</th></tr></thead><tbody>
        <tr><th>Points</th>${cell('blue', 'score')}${cell('red', 'score')}</tr>
        <tr><th>Turns</th>${cell('blue', 'turns')}${cell('red', 'turns')}</tr>
        <tr><th>Skips</th>${cell('blue', 'skips')}${cell('red', 'skips')}</tr>
        <tr><th>Hints</th>${cell('blue', 'hints')}${cell('red', 'hints')}</tr>
      </tbody></table>
      <div class="study">${studyHTML(w)}${studyHTML(l)}</div>
      <p class="tip">Learn each word with its meaning, then play again and beat your score!</p>
    </div>
    <button class="action" id="again">${PLAY} REMATCH</button>
    <button class="practice" id="decks">Pick a different game</button>
  </div>`;
  wireSound(); wireHome();
  document.getElementById('again').onclick = () => { Sound.unlock(); S.target = M.target; startMatch(); };
  document.getElementById('decks').onclick = toGames;
  window.scrollTo(0, 0);
}

/* ------------------------------------------------------------ confetti */
function confetti() {
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv = document.getElementById('confetti'), cx = cv.getContext('2d');
  const W = cv.width = innerWidth * devicePixelRatio, H = cv.height = innerHeight * devicePixelRatio;
  const cols = ['#FFD23F', '#FF4F9A', '#F07F1E', '#1FA463', '#2389D6', '#8A3FB5', '#FFFFFF'];
  const bits = Array.from({ length: 160 }, () => ({ x: W / 2 + (Math.random() - .5) * W * .3, y: H * .35, vx: (Math.random() - .5) * 26 * devicePixelRatio,
    vy: (-Math.random() * 22 - 8) * devicePixelRatio, s: (6 + Math.random() * 8) * devicePixelRatio, r: Math.random() * 6, vr: (Math.random() - .5) * .4, c: cols[Math.floor(Math.random() * cols.length)] }));
  let t = 0;
  const draw = () => {
    cx.clearRect(0, 0, W, H);
    bits.forEach(b => { b.vy += .9 * devicePixelRatio; b.x += b.vx; b.y += b.vy; b.vx *= .985; b.r += b.vr;
      cx.save(); cx.translate(b.x, b.y); cx.rotate(b.r); cx.fillStyle = b.c; cx.fillRect(-b.s / 2, -b.s / 4, b.s, b.s / 2); cx.restore(); });
    if (++t < 150) requestAnimationFrame(draw); else cx.clearRect(0, 0, W, H);
  };
  draw();
}

/* ------------------------------------------------------------ boot */
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.phase === 'playing') holdWake(true); });
const boot = () => renderHome();
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot();
</script>
