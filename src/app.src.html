<title>Mr Chait's One Minute MadneSS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Nunito:wght@700;800;900&display=swap">
<style>
/* Layout: one-screen game. Home picks a deck; the game screen is a single card whose header holds the timer ring, with one big action button underneath. */
:root{
  --night:#241A4D; --night-2:#2E2266; --night-3:#3A2D7A;
  --sun:#FFD23F; --pop:#FF4F9A; --paper:#FFFFFF; --ink:#1B1438; --ink-soft:#5B5480;
  --good:#1FA463; --good-t:#E3F6EC; --bad:#E0303F; --hint:#FFF5CC; --hint-line:#F0B400;
  --disabled:#B9B3D6;
  --display:'Luckiest Guy', 'Arial Black', Impact, sans-serif;
  --body:'Nunito', 'Trebuchet MS', 'Segoe UI', sans-serif;
  color-scheme: dark;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--paper);font-family:var(--body);overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:repeating-conic-gradient(from 0deg at 50% 40%,var(--night-2) 0deg 9deg,var(--night) 9deg 18deg);opacity:.9}
.app{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column;align-items:center;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:14px 20px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:4px solid var(--sun);outline-offset:3px}

/* ---------- logo */
.logo{font-family:var(--display);line-height:.86;display:inline-flex;flex-direction:column;align-items:flex-start}
.logo .mr{background:var(--pop);color:var(--paper);font-size:.42em;letter-spacing:.06em;padding:.3em .55em .14em;border-radius:.5em;
  transform:rotate(-4deg);margin-bottom:.3em;box-shadow:.1em .1em 0 var(--sun)}
.logo .one{color:var(--sun);font-size:.52em;letter-spacing:.06em}
.logo .mad{color:var(--paper)}
.logo .mad b{font-weight:400;color:var(--pop);font-size:1.2em;-webkit-text-stroke:.03em var(--paper);paint-order:stroke fill;text-shadow:.05em .05em 0 var(--sun)}

/* ---------- top bar */
.bar{width:100%;max-width:640px;display:flex;align-items:center;gap:10px;min-height:48px}
.bar .grow{flex:1}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--night-3);border:2px solid rgba(255,255,255,.18);
  border-radius:999px;padding:8px 14px;font-weight:900;font-size:15px;letter-spacing:.02em}
.chip svg{flex:none}
.round-label{font-family:var(--display);font-size:20px;letter-spacing:.04em;color:var(--sun)}

/* ---------- home */
.home{width:100%;max-width:640px;display:flex;flex-direction:column;align-items:center;gap:22px;padding-top:8px}
.hero{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.hero .logo{font-size:clamp(46px, 13vw, 84px);align-items:center}
.hero .logo .mr{align-self:center}
.tagline{font-weight:800;font-size:17px;color:var(--sun);max-width:34ch}
.section-title{align-self:flex-start;font-family:var(--display);font-size:22px;letter-spacing:.04em;color:var(--paper)}
.decks{width:100%;display:grid;grid-template-columns:1fr;gap:12px}
.deck{display:flex;align-items:center;gap:16px;text-align:left;width:100%;background:var(--paper);color:var(--ink);
  border-radius:20px;padding:16px 18px;border:4px solid var(--sun);box-shadow:0 6px 0 var(--pop);transition:transform .12s}
.deck:active{transform:translateY(3px);box-shadow:0 3px 0 var(--pop)}
.deck .stack{flex:none;width:58px;height:72px;border-radius:10px;background:var(--night);display:flex;align-items:center;justify-content:center;
  box-shadow:5px 5px 0 var(--night-3), 9px 9px 0 var(--sun)}
.deck .info{flex:1;min-width:0}
.deck h3{margin:0;font-family:var(--display);font-weight:400;font-size:24px;letter-spacing:.03em;color:var(--night)}
.deck p{margin:2px 0 8px;font-weight:800;font-size:14px;color:var(--ink-soft)}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots span{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;
  color:var(--paper);background:var(--c);border-radius:999px;padding:3px 8px}
.deck .go{flex:none;width:52px;height:52px;border-radius:50%;background:var(--sun);display:flex;align-items:center;justify-content:center;color:var(--night)}
.deck.soon{background:transparent;border:3px dashed rgba(255,255,255,.3);box-shadow:none;color:var(--paper);cursor:default}
.deck.soon h3{color:var(--paper);opacity:.75}
.deck.soon p{color:var(--disabled)}
.deck.soon .stack{background:transparent;border:3px dashed rgba(255,255,255,.3);box-shadow:none}
.how{width:100%;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.14);border-radius:20px;padding:16px 18px}
.how ol{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.how li{display:flex;gap:12px;align-items:flex-start;font-weight:800;font-size:15.5px;line-height:1.35;color:#E9E5FF}
.how li b{color:var(--sun)}
.how .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--pop);color:var(--paper);font-family:var(--display);
  font-size:16px;display:flex;align-items:center;justify-content:center;padding-top:2px}

/* ---------- game */
.game{width:100%;max-width:640px;flex:1;display:flex;flex-direction:column;align-items:center;gap:16px}
.stage{width:100%;perspective:1400px}
.card{position:relative;width:100%;border-radius:26px;background:var(--paper);color:var(--ink);overflow:hidden;
  border:6px solid var(--night);box-shadow:0 0 0 4px var(--sun), 0 14px 0 4px var(--pop);
  transform-style:preserve-3d}
.card.flip{animation:flip .55s cubic-bezier(.2,.8,.3,1.2)}
@keyframes flip{0%{transform:rotateY(90deg) scale(.95)}100%{transform:rotateY(0) scale(1)}}
.card.shake{animation:shake .5s}
@keyframes shake{20%,60%{transform:translateX(-10px) rotate(-1deg)}40%,80%{transform:translateX(10px) rotate(1deg)}}
.head{background:var(--night);color:var(--paper);display:flex;align-items:center;gap:12px;padding:14px 16px 14px 18px;
  background-image:radial-gradient(rgba(255,255,255,.10) 1.2px,transparent 1.6px);background-size:12px 12px}
.head .logo{font-size:clamp(26px, 6.4vw, 36px)}
.head .grow{flex:1}

/* timer ring */
.timer{position:relative;flex:none;width:clamp(78px, 21vw, 104px);aspect-ratio:1;max-width:100%}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer .track{fill:var(--night-3);stroke:rgba(255,255,255,.18);stroke-width:9}
.timer .fill{fill:none;stroke:var(--sun);stroke-width:9;stroke-linecap:round;transition:stroke .3s}
.timer .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:var(--display);color:var(--paper);font-size:clamp(28px, 8vw, 40px);line-height:.9;padding-top:4px;font-variant-numeric:tabular-nums}
.timer .num small{font-family:var(--body);font-weight:900;font-size:11px;letter-spacing:.12em;color:var(--sun)}
.timer.hurry .fill{stroke:var(--pop)}
.timer.hurry .num{animation:pulse 1s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}

.rows{display:flex;flex-direction:column;gap:14px;padding:18px}
.row{--c:#888;--t:#eee;display:flex;flex-direction:column;border-radius:18px;background:var(--t);border:3px solid var(--c);overflow:hidden;
  transition:background .25s, border-color .25s}
.row .main{display:flex;align-items:center;gap:14px;padding:12px 12px 12px 12px}
.disc{flex:none;width:46px;height:46px;border-radius:50%;background:var(--c);color:var(--paper);font-family:var(--display);font-size:24px;
  display:flex;align-items:center;justify-content:center;padding-top:3px;box-shadow:inset 0 -5px 0 rgba(0,0,0,.18)}
.txt{flex:1;min-width:0}
.word{font-weight:900;font-size:clamp(23px, 5.6vw, 32px);line-height:1.08;color:var(--ink);overflow-wrap:anywhere}
.tag{display:flex;align-items:center;gap:6px;margin-top:4px;font-weight:900;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--c)}
.tick{flex:none;width:68px;height:68px;border-radius:50%;background:var(--paper);border:4px solid var(--c);color:var(--c);
  display:flex;align-items:center;justify-content:center;transition:transform .12s, background .2s}
.tick:active{transform:scale(.9)}
.tick svg{width:34px;height:34px}
.row.got{--c:var(--good) !important;--t:var(--good-t) !important}
.row.got .tick{background:var(--good);color:var(--paper);border-color:var(--good);animation:pop .35s}
.row.got .word{text-decoration:line-through;text-decoration-thickness:3px;text-decoration-color:rgba(31,164,99,.55)}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.row.missed .tick{background:transparent;border-color:var(--disabled);color:var(--disabled);cursor:default}
.hintbox{display:none;margin:0 12px 12px;background:var(--hint);border:3px dashed var(--hint-line);border-radius:14px;padding:10px 14px}
.row.missed .hintbox{display:block;animation:drop .35s ease-out}
@keyframes drop{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.hintbox .lbl{font-family:var(--display);font-size:16px;letter-spacing:.05em;color:var(--bad)}
.hintbox p{margin:2px 0 0;font-weight:800;font-size:clamp(16px, 3.9vw, 19px);line-height:1.35;color:var(--ink)}
.hintbox .nt{margin-top:6px;font-size:13px;font-weight:900;color:var(--ink-soft);letter-spacing:.02em}

/* card back (ready screen) */
.back{background:var(--night);border-color:var(--night);min-height:clamp(380px, 62vh, 470px);display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:18px;padding:26px 20px;text-align:center;
  background-image:repeating-conic-gradient(from 0deg at 50% 42%,var(--night-2) 0deg 10deg,var(--night) 10deg 20deg)}
.badge{width:min(250px, 64vw);aspect-ratio:1;max-width:100%;border-radius:50%;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  border:7px solid var(--sun);box-shadow:0 0 0 7px var(--pop);transform:rotate(-6deg)}
.badge .logo{font-size:clamp(30px, 8vw, 40px);align-items:center}
.badge .logo .mr{align-self:center}
.badge .logo .one,.badge .logo .mad{color:var(--night)}
.back .msg{max-width:30ch;font-weight:900;font-size:17px;line-height:1.35;color:var(--paper)}
.back .msg b{color:var(--sun)}

/* banner over the card */
.banner{position:absolute;left:50%;top:92px;transform:translateX(-50%) rotate(-5deg);z-index:3;white-space:nowrap;
  font-family:var(--display);font-size:clamp(30px, 8vw, 44px);letter-spacing:.04em;padding:10px 22px 4px;border-radius:14px;
  border:5px solid var(--paper);box-shadow:0 6px 0 rgba(0,0,0,.25);animation:stamp .45s cubic-bezier(.2,.8,.3,1.4) both;pointer-events:none}
.banner.up{background:var(--bad);color:var(--paper)}
.banner.win{background:var(--sun);color:var(--night)}
.banner.win b{font-weight:400;color:var(--pop)}
@keyframes stamp{from{transform:translateX(-50%) rotate(-5deg) scale(2.2);opacity:0}to{transform:translateX(-50%) rotate(-5deg) scale(1);opacity:1}}
.banner.fade{animation:fadeout .5s 1.6s forwards}
@keyframes fadeout{to{opacity:0;transform:translateX(-50%) rotate(-5deg) translateY(-20px)}}

/* big action button */
.action{width:min(420px, 100%);font-family:var(--display);font-size:clamp(28px, 7vw, 36px);letter-spacing:.06em;
  padding:16px 20px 10px;border-radius:20px;background:var(--sun);color:var(--night);
  box-shadow:0 8px 0 var(--pop);transition:transform .1s, box-shadow .1s;display:flex;align-items:center;justify-content:center;gap:12px}
.action:active{transform:translateY(5px);box-shadow:0 3px 0 var(--pop)}
.action.next{background:var(--pop);color:var(--paper);box-shadow:0 8px 0 var(--sun)}
.action.next:active{box-shadow:0 3px 0 var(--sun)}
.status{min-height:22px;font-weight:900;font-size:16px;color:var(--sun);text-align:center}

/* Mr Chait */
.lockup{display:inline-flex;align-items:center;gap:6px}
.lockup .me{flex:none;height:var(--me,120px);width:auto;max-width:none;filter:drop-shadow(0 4px 0 rgba(0,0,0,.18))}
.hero .lockup{--me:clamp(150px, 34vw, 230px);gap:clamp(4px, 2vw, 14px)}
.hero .lockup .logo{align-items:flex-start;font-size:clamp(40px, 10.5vw, 74px)}
.hero .lockup .logo .mr{align-self:flex-start}
.head .lockup{--me:clamp(70px, 17vw, 92px);margin:-6px 0 -10px -6px}
.backart{position:relative;display:flex;align-items:flex-end;justify-content:center;padding-left:clamp(70px, 20vw, 110px)}
.backart .me{position:absolute;left:0;bottom:-10px;height:clamp(150px, 40vw, 210px);width:auto;max-width:none;z-index:2;transform:rotate(-4deg)}
.react{position:fixed;right:max(12px, env(safe-area-inset-right, 0px));bottom:calc(-260px - env(safe-area-inset-bottom, 0px));z-index:15;display:flex;align-items:flex-end;gap:4px;
  transition:bottom .45s cubic-bezier(.2,.8,.3,1.3);pointer-events:none}
.react.show{bottom:calc(8px + env(safe-area-inset-bottom, 0px))}
.react img{height:clamp(150px, 26vh, 220px);width:auto;max-width:none}
.react .say{order:-1;margin-bottom:clamp(110px, 18vh, 160px);background:var(--paper);color:var(--night);font-family:var(--display);font-size:clamp(20px, 5vw, 26px);
  letter-spacing:.03em;padding:10px 14px 6px;border-radius:16px;border:4px solid var(--night);box-shadow:4px 4px 0 var(--pop);position:relative;max-width:220px;text-align:center}
.react .say::after{content:"";position:absolute;right:-14px;bottom:14px;border:10px solid transparent;border-left:14px solid var(--night)}
.react .say b{font-weight:400;color:var(--pop)}
canvas#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:20}
@media (prefers-reduced-motion: reduce){
  .card.flip,.card.shake,.row.got .tick,.row.missed .hintbox,.timer.hurry .num,.banner{animation:none !important}
}
</style>

<div class="app" id="app"></div>
<canvas id="confetti"></canvas>
<div class="react" id="react" aria-hidden="true"><div class="say" id="say"></div><img alt="" id="reactimg"></div>

<script>
/*DECKS*/

/* ------------------------------------------------------------ decks */
const DECKS = [DECK_G6SS];
const COMING = [
  { title: 'Grade 7 Social Sciences', note: 'Coming soon' },
  { title: 'Grade 7 EMS', note: 'Coming soon' },
];
const ROUND_SECONDS = 60;

/* ------------------------------------------------------------ icons */
const ICONS = {
  E: c => `<svg width="15" height="15" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="${c}" stroke-width="2.6"/><path d="M12 4 L14.6 12 L12 20 L9.4 12 Z" fill="${c}"/></svg>`,
  P: c => `<svg width="15" height="15" viewBox="0 0 24 24"><circle cx="8" cy="7" r="3.2" fill="${c}"/><circle cx="16.5" cy="8" r="2.7" fill="${c}"/><path d="M2 20 Q2 12 8 12 Q14 12 14 20 Z M12.5 20 Q13 13.5 16.5 13.5 Q22 13.5 22 20 Z" fill="${c}"/></svg>`,
  C: c => `<svg width="15" height="15" viewBox="0 0 24 24"><circle cx="9" cy="9" r="4.2" fill="${c}"/><path d="M9 1.5v2.4M9 14.1v2.4M1.5 9h2.4M3.7 3.7l1.7 1.7M12.6 5.4l1.7-1.7M3.7 14.3l1.7-1.7" stroke="${c}" stroke-width="2" stroke-linecap="round"/><path d="M7 21 Q3 21 3.5 17.5 Q4 14.5 7.5 15 Q8.5 11.5 12.5 12 Q16.5 12 17 15.5 Q21 15.5 21 18.5 Q21 21 18 21 Z" fill="${c}"/></svg>`,
  D: c => `<svg width="15" height="15" viewBox="0 0 24 24"><rect x="3" y="10" width="18" height="11" rx="2" fill="${c}"/><rect x="7.5" y="2.5" width="9" height="10" rx="1" fill="none" stroke="${c}" stroke-width="2"/><path d="M9.5 7 L11.3 9 L14.7 5" fill="none" stroke="${c}" stroke-width="1.8" stroke-linecap="round"/></svg>`,
  M: c => `<svg width="15" height="15" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="18" rx="1.5" fill="${c}"/><rect x="3" y="9" width="18" height="6" rx="1.5" fill="${c}"/></svg>`,
};
const TICK = `<svg viewBox="0 0 24 24" fill="none"><path d="M4.5 12.5 L9.5 17.5 L19.5 6.5" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const LOCK = `<svg viewBox="0 0 24 24" fill="none"><rect x="5" y="11" width="14" height="10" rx="2.5" fill="currentColor"/><path d="M8 11V8a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="2.6"/></svg>`;
const HOME = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M3 11 L12 3.5 L21 11 M5.5 9.5V20h13V9.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const SOUND_ON = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>`;
const SOUND_OFF = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>`;
const PLAY = `<svg width="26" height="26" viewBox="0 0 24 24"><path d="M7 4.5v15l12.5-7.5z" fill="currentColor"/></svg>`;
const HOURGLASS = (s, frame, sand) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><rect x="4" y="1.5" width="16" height="2.6" rx="1.2" fill="${frame}"/><rect x="4" y="19.9" width="16" height="2.6" rx="1.2" fill="${frame}"/><path d="M6 4.1 L18 4.1 Q18 9 12 12 Q18 15 18 19.9 L6 19.9 Q6 15 12 12 Q6 9 6 4.1 Z" fill="none" stroke="${frame}" stroke-width="1.8"/><path d="M8 6.5 L16 6.5 Q15 9.5 12 11 Q9 9.5 8 6.5 Z M8.5 19 Q12 15.5 15.5 19 Z" fill="${sand}"/></svg>`;
const LOGO = `<div class="logo"><span class="mr">MR CHAIT’S</span><span class="one">ONE MINUTE</span><span class="mad">MADNE<b>SS</b></span></div>`;
const CHAIT = '__CHAIT__';
const ME = (extra = '') => `<img class="me" src="${CHAIT}" alt="Mr Chait giving a thumbs up"${extra}>`;
const LOCKUP = () => `<div class="lockup">${ME()}${LOGO}</div>`;
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ------------------------------------------------------------ sound (Web Audio, no files) */
const Sound = (() => {
  let ctx = null, on = true;
  try { on = localStorage.getItem('omm-sound') !== 'off'; } catch (e) {}
  const ac = () => { if (!ctx) { const A = window.AudioContext || window.webkitAudioContext; if (A) ctx = new A(); } if (ctx && ctx.state === 'suspended') ctx.resume(); return ctx; };
  const tone = (f, t0, dur, type = 'sine', vol = .25, f2) => {
    const c = ac(); if (!c || !on) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, c.currentTime + t0);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, c.currentTime + t0 + dur);
    g.gain.setValueAtTime(0.0001, c.currentTime + t0);
    g.gain.exponentialRampToValueAtTime(vol, c.currentTime + t0 + .015);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + t0 + dur);
    o.connect(g).connect(c.destination); o.start(c.currentTime + t0); o.stop(c.currentTime + t0 + dur + .05);
  };
  return {
    unlock: ac,
    get on() { return on; },
    toggle() { on = !on; try { localStorage.setItem('omm-sound', on ? 'on' : 'off'); } catch (e) {} if (on) this.ding(); return on; },
    start() { [523, 659, 784, 1047].forEach((f, i) => tone(f, i * .08, .18, 'triangle', .22)); },
    ding() { tone(988, 0, .14, 'sine', .3); tone(1319, .09, .3, 'sine', .3); },
    undo() { tone(330, 0, .14, 'triangle', .2, 220); },
    tick(hi) { tone(hi ? 1500 : 1150, 0, .05, 'square', .07); },
    buzz() { tone(150, 0, .75, 'sawtooth', .22, 110); tone(156, 0, .75, 'square', .12, 115); },
    win() { [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tone(f, i * .09, .22, 'triangle', .22)); },
  };
})();

/* ------------------------------------------------------------ shuffled cards: 3 words from 3 different topics */
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function Dealer(deck) {
  let pools = {};
  const refill = () => { pools = {}; deck.words.forEach(([t, w, h]) => (pools[t] = pools[t] || []).push({ t, w, h })); Object.values(pools).forEach(shuffle); };
  refill();
  return () => {
    let keys = Object.keys(pools).filter(k => pools[k].length);
    if (keys.length < 3) { refill(); keys = Object.keys(pools); }
    keys = keys.sort((a, b) => pools[b].length - pools[a].length || Math.random() - .5).slice(0, 3);
    return shuffle(keys).map(k => pools[k].pop());
  };
}

/* ------------------------------------------------------------ app state */
const app = document.getElementById('app');
const S = { screen: 'home', deck: null, deal: null, round: 0, card: null, phase: 'ready', got: [false, false, false], left: ROUND_SECONDS, endAt: 0, raf: 0, lastSec: null };
let wake = null;
const holdWake = async on => {
  try { if (on && 'wakeLock' in navigator && !wake) wake = await navigator.wakeLock.request('screen'); if (!on && wake) { await wake.release(); wake = null; } } catch (e) { wake = null; }
};

function soundBtn() {
  return `<button class="chip" id="snd" aria-label="${Sound.on ? 'Turn sound off' : 'Turn sound on'}">${Sound.on ? SOUND_ON : SOUND_OFF}<span>${Sound.on ? 'Sound on' : 'Sound off'}</span></button>`;
}
function wireSound() {
  const b = document.getElementById('snd'); if (!b) return;
  b.onclick = () => { Sound.unlock(); Sound.toggle(); b.outerHTML = soundBtn(); wireSound(); };
}

/* ------------------------------------------------------------ home */
function renderHome() {
  hideReact();
  stopTimer(); holdWake(false);
  const decks = DECKS.map((d, i) => {
    const dots = Object.entries(d.topics).map(([k, t]) => `<span style="--c:${t.c}">${ICONS[k]('#fff')}${t.name}</span>`).join('');
    return `<button class="deck" data-deck="${i}"><div class="stack">${HOURGLASS(30, '#FFD23F', '#FF4F9A')}</div>
      <div class="info"><h3>${esc(d.title)}</h3><p>${d.words.length} words · shuffled every game</p><div class="dots">${dots}</div></div>
      <div class="go">${PLAY}</div></button>`;
  }).join('') + COMING.map(c => `<div class="deck soon" aria-disabled="true"><div class="stack"></div><div class="info"><h3>${esc(c.title)}</h3><p>${c.note}</p></div></div>`).join('');
  app.innerHTML = `
    <div class="bar"><div class="grow"></div>${soundBtn()}</div>
    <div class="home">
      <div class="hero">${LOCKUP()}<div class="tagline">Describe it. Don’t say it. You’ve got one minute!</div></div>
      <div class="section-title">Pick a deck</div>
      <div class="decks">${decks}</div>
      <div class="how"><ol>
        <li><span class="n">1</span><span>The <b>Explainer</b> holds the iPad so their partner can’t see it, and taps <b>Start</b>.</span></li>
        <li><span class="n">2</span><span>Describe each of the <b>3 words</b> without saying the word or any part of it.</span></li>
        <li><span class="n">3</span><span>Partner guessed it? Tap the <b>tick</b>. Get all three for some <b>MadneSS</b>!</span></li>
        <li><span class="n">4</span><span>Time’s up? A <b>hint</b> appears for every word you missed. Keep explaining with it, but no more ticks. Then swap!</span></li>
      </ol></div>
    </div>`;
  wireSound();
  app.querySelectorAll('[data-deck]').forEach(b => b.onclick = () => { Sound.unlock(); startDeck(+b.dataset.deck); });
}

/* ------------------------------------------------------------ game */
function startDeck(i) {
  S.deck = DECKS[i]; S.deal = Dealer(S.deck); S.round = 0; S.screen = 'game';
  nextRound();
}
function nextRound() {
  hideReact();
  S.round++; S.card = S.deal(); S.phase = 'ready'; S.got = [false, false, false]; S.left = ROUND_SECONDS;
  renderGame(true);
}
function topBar() {
  return `<div class="bar"><button class="chip" id="home" aria-label="Back to decks">${HOME}<span>Decks</span></button>
    <div class="grow"></div><span class="round-label">CARD ${S.round}</span><div class="grow"></div>${soundBtn()}</div>`;
}
function ring() {
  const r = 44, C = 2 * Math.PI * r;
  return `<div class="timer" id="timer"><svg viewBox="0 0 100 100"><circle class="track" cx="50" cy="50" r="${r}"/>
    <circle class="fill" id="ringfill" cx="50" cy="50" r="${r}" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="0"/></svg>
    <div class="num"><span id="secs">${S.left}</span><small>SEC</small></div></div>`;
}
function rowHTML(x, i) {
  const t = S.deck.topics[x.t];
  return `<div class="row" id="row${i}" style="--c:${t.c};--t:${t.t}">
    <div class="main"><div class="disc">${i + 1}</div>
      <div class="txt"><div class="word">${esc(x.w)}</div><div class="tag">${ICONS[x.t](t.c)}${t.name}</div></div>
      <button class="tick" data-i="${i}" aria-label="Partner guessed ${esc(x.w)}">${TICK}</button></div>
    <div class="hintbox"><div class="lbl">HINT</div><p>${esc(x.h)}</p><div class="nt">Keep explaining! This one can’t be ticked now.</div></div></div>`;
}
function renderGame(animate) {
  let body;
  if (S.phase === 'ready') {
    body = `<div class="stage"><div class="card back${animate ? ' flip' : ''}">
      <div class="backart">${ME()}<div class="badge">${HOURGLASS(44, '#241A4D', '#FF4F9A')}${LOGO}</div></div>
      <div class="msg"><b>Explainer:</b> hold the iPad so your partner can’t see the screen, then tap <b>START</b>.</div></div></div>
      <button class="action" id="go">${PLAY} START</button><div class="status"></div>`;
  } else {
    body = `<div class="stage"><div class="card${animate ? ' flip' : ''}" id="card">
      <div class="head">${LOCKUP()}<div class="grow"></div>${ring()}</div>
      <div class="rows">${S.card.map(rowHTML).join('')}</div></div></div>
      <button class="action next" id="next"${S.phase === 'done' ? '' : ' hidden'}>NEXT ROUND</button>
      <div class="status" id="status">${S.phase === 'playing' ? 'Tap the tick as soon as your partner says the word!' : ''}</div>`;
  }
  app.innerHTML = `${topBar()}<div class="game">${body}</div>`;
  wireSound();
  document.getElementById('home').onclick = () => { S.screen = 'home'; renderHome(); };
  if (S.phase === 'ready') document.getElementById('go').onclick = beginRound;
  else {
    app.querySelectorAll('.tick').forEach(b => b.onclick = () => toggleTick(+b.dataset.i));
    const nx = document.getElementById('next'); if (nx) nx.onclick = nextRound;
    S.got.forEach((g, i) => { if (g) document.getElementById('row' + i).classList.add('got'); });
    if (S.phase === 'done') S.got.forEach((g, i) => { if (!g) markMissed(i); });
    paintTimer();
  }
}
function beginRound() {
  Sound.unlock(); Sound.start(); holdWake(true);
  S.phase = 'playing'; S.left = ROUND_SECONDS; S.endAt = performance.now() + ROUND_SECONDS * 1000; S.lastSec = ROUND_SECONDS;
  renderGame(true); loop();
}
function toggleTick(i) {
  if (S.phase !== 'playing') return;
  S.got[i] = !S.got[i];
  document.getElementById('row' + i).classList.toggle('got', S.got[i]);
  if (S.got[i]) Sound.ding(); else Sound.undo();
  if (S.got.every(Boolean)) endRound(true);
}
function markMissed(i) {
  const row = document.getElementById('row' + i); row.classList.add('missed');
  const b = row.querySelector('.tick'); b.innerHTML = LOCK; b.disabled = true; b.setAttribute('aria-label', 'Time is up for this word');
}
function paintTimer() {
  const el = document.getElementById('timer'); if (!el) return;
  const r = 44, C = 2 * Math.PI * r;
  const frac = Math.max(0, S.left) / ROUND_SECONDS;
  document.getElementById('ringfill').setAttribute('stroke-dashoffset', (C * (1 - frac)).toFixed(1));
  document.getElementById('secs').textContent = Math.ceil(Math.max(0, S.left));
  el.classList.toggle('hurry', S.phase === 'playing' && S.left <= 10);
}
function loop() {
  cancelAnimationFrame(S.raf);
  const step = () => {
    if (S.phase !== 'playing') return;
    S.left = (S.endAt - performance.now()) / 1000;
    const sec = Math.ceil(S.left);
    if (sec !== S.lastSec) { S.lastSec = sec; if (sec <= 10 && sec > 0) Sound.tick(sec % 2 === 0); }
    paintTimer();
    if (S.left <= 0) { S.left = 0; paintTimer(); endRound(false); return; }
    S.raf = requestAnimationFrame(step);
  };
  S.raf = requestAnimationFrame(step);
}
function stopTimer() { cancelAnimationFrame(S.raf); }
function endRound(won) {
  stopTimer(); S.phase = 'done'; holdWake(false); paintTimer();
  const card = document.getElementById('card');
  const banner = document.createElement('div');
  if (won) {
    banner.className = 'banner win fade'; banner.innerHTML = 'MADNE<b>SS</b>! ALL 3!';
    Sound.win(); confetti();
  } else {
    banner.className = 'banner up fade'; banner.textContent = 'TIME’S UP!';
    Sound.buzz(); card.classList.remove('flip'); void card.offsetWidth; card.classList.add('shake');
    S.got.forEach((g, i) => { if (!g) markMissed(i); });
  }
  card.appendChild(banner);
  react(won ? 'MADNE<b>SS</b>!<br>LEGENDS!' : 'Use the <b>hint</b>! Keep going!');
  const n = S.got.filter(Boolean).length;
  document.getElementById('status').textContent = won ? 'All three words in time. Swap roles for the next round!'
    : `${n} of 3 guessed. Use the hints to finish explaining, then swap roles.`;
  document.getElementById('next').hidden = false;
}

/* ------------------------------------------------------------ Mr Chait pops up */
let reactT = 0;
function react(html) {
  const r = document.getElementById('react'); document.getElementById('reactimg').src = CHAIT;
  document.getElementById('say').innerHTML = html; r.classList.add('show');
  clearTimeout(reactT); reactT = setTimeout(() => r.classList.remove('show'), 2800);
}
function hideReact() { clearTimeout(reactT); document.getElementById('react').classList.remove('show'); }

/* ------------------------------------------------------------ confetti */
function confetti() {
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv = document.getElementById('confetti'), cx = cv.getContext('2d');
  const W = cv.width = innerWidth * devicePixelRatio, H = cv.height = innerHeight * devicePixelRatio;
  const cols = ['#FFD23F', '#FF4F9A', '#F07F1E', '#1FA463', '#2389D6', '#8A3FB5', '#FFFFFF'];
  const bits = Array.from({ length: 160 }, () => ({ x: W / 2 + (Math.random() - .5) * W * .3, y: H * .35, vx: (Math.random() - .5) * 26 * devicePixelRatio,
    vy: (-Math.random() * 22 - 8) * devicePixelRatio, s: (6 + Math.random() * 8) * devicePixelRatio, r: Math.random() * 6, vr: (Math.random() - .5) * .4, c: cols[Math.floor(Math.random() * cols.length)] }));
  let t = 0;
  const draw = () => {
    cx.clearRect(0, 0, W, H);
    bits.forEach(b => { b.vy += .9 * devicePixelRatio; b.x += b.vx; b.y += b.vy; b.vx *= .985; b.r += b.vr;
      cx.save(); cx.translate(b.x, b.y); cx.rotate(b.r); cx.fillStyle = b.c; cx.fillRect(-b.s / 2, -b.s / 4, b.s, b.s / 2); cx.restore(); });
    if (++t < 150) requestAnimationFrame(draw); else cx.clearRect(0, 0, W, H);
  };
  draw();
}

/* ------------------------------------------------------------ boot */
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.phase === 'playing') holdWake(true); });
const boot = () => renderHome();
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot();
</script>
